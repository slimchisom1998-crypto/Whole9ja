<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Whole9ja RP - Fancy Lekki Edition</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}body{background:#0a1210;color:#fff;overflow:hidden;touch-action:none}#top{position:fixed;top:0;left:0;right:0;height:56px;background:linear-gradient(90deg,#102018,#1c3522);display:flex;align-items:center;gap:8px;padding:0 12px;z-index:100;border-bottom:1px solid #2a4a32}.pill{background:rgba(255,255,255,.1);border-radius:20px;padding:6px 12px;font-size:11px;backdrop-filter:blur(10px)}.money{background:#fff;color:#000;font-weight:800;font-size:13px}#game{position:absolute;top:56px;bottom:90px;left:0;right:0;overflow:hidden;background:radial-gradient(ellipse at center,#1e3a2a 0%,#0d1f14 100%)}#world{position:absolute;width:200%;height:200%;left:-50%;top:-20%;transform:scale(1)}#floor{position:absolute;width:900px;height:700px;left:50%;top:45%;transform:translate(-50%,-50%) rotateX(60deg) rotateZ(-45deg);background:linear-gradient(135deg,#f7f3e8 0%,#e8e0c5 100%);box-shadow:0 0 0 12px #1a2e20,0 0 0 13px #2a4a32,0 40px 80px rgba(0,0,0,.6);border-radius:4px}.wall{position:absolute;background:linear-gradient(180deg,#2a3a4a,#1e2a36);box-shadow:inset 0 0 30px rgba(0,0,0,.5)}.furn{position:absolute;display:flex;align-items:center;justify-content:center;font-size:40px;filter:drop-shadow(0 10px 10px rgba(0,0,0,.5));transition:.2s}#player{position:absolute;width:34px;height:34px;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;transition:all .6s cubic-bezier(.34,1.56,.64,1)}#player .body{width:28px;height:36px;background:linear-gradient(180deg,#2a6a3a,#1a4a2a);border-radius:12px 12px 6px 6px;position:relative}#player .head{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:20px;height:20px;background:#ffdbac;border-radius:50%;border:2px solid #1a4a2a}#player .shadow{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:30px;height:10px;background:rgba(0,0,0,.4);border-radius:50%;filter:blur(2px)}#other{position:absolute;width:34px;height:34px;z-index:19;display:none}#other .body{width:28px;height:36px;background:linear-gradient(180deg,#8a2a5a,#5a1a3a);border-radius:12px 12px 6px 6px;position:relative}#other .head{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:20px;height:20px;background:#ffdbac;border-radius:50%}.window{position:absolute;top:20px;right:30px;width:260px;height:140px;background:linear-gradient(180deg,#87ceeb 0%,#f0e68c 60%,#2a5a3a 100%);border:8px solid #1a2a1a;border-radius:6px;overflow:hidden;z-index:5}.window::after{content:'LEKKI PHASE 1';position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:2px 8px;border-radius:10px;font-size:9px;font-weight:bold;letter-spacing:1px}.city{position:absolute;bottom:18px;width:100%;height:30px;display:flex;gap:6px;justify-content:center}.city span{width:18px;background:#2a3a4a;border-radius:2px 2px 0 0}.city span:nth-child(2){height:40px;margin-top:-10px;background:#3a4a5a}#jobs{position:absolute;right:12px;top:12px;z-index:30;background:rgba(10,20,12,.92);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:12px;width:190px;box-shadow:0 10px 30px rgba(0,0,0,.5)}.job{width:100%;margin:4px 0;padding:8px 10px;border:none;border-radius:10px;background:linear-gradient(135deg,#2a5a3a,#1e3a2a);color:#fff;font-size:11px;text-align:left;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.job:active{transform:scale(.97)}#bottom{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,#162a1a,#0d1a10);padding:8px 12px;z-index:100;border-top:1px solid #2a4a32}#stats{display:flex;gap:10px;align-items:center}.av{width:42px;height:42px;border-radius:50%;border:2px solid #4caf50;background:url(https://i.pravatar.cc/42?u=BigT);background-size:cover}.meters{flex:1;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.meter{height:6px;background:#1a2a1a;border-radius:3px;overflow:hidden;position:relative}.meter div{height:100%;border-radius:3px}.meter span{font-size:7px;position:absolute;top:-10px;left:0;color:#8a9a8a}#nav{display:flex;gap:8px;margin-top:10px}.n{flex:1;padding:10px;border:none;border-radius:14px;background:rgba(255,255,255,.08);color:#aabbaa;font-size:11px;font-weight:600}.n.active{background:#fff;color:#000;box-shadow:0 4px 12px rgba(255,255,255,.2)}#modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}#mbox{background:#fff;color:#111;border-radius:20px;padding:20px;max-width:360px;width:100%;max-height:80vh;overflow:auto}.b{padding:10px 16px;border:none;border-radius:12px;background:#00c853;color:#fff;font-weight:700;margin:4px;cursor:pointer}.alert{position:absolute;left:12px;top:12px;z-index:25;background:#ffeb3b;color:#000;border-radius:12px;padding:10px 12px;font-size:11px;max-width:200px;box-shadow:0 8px 20px rgba(0,0,0,.4);display:none}</style></head><body><div id="top"><div class="pill">🕒 <span id="clock">8:14 PM</span></div><div class="pill money">₦<span id="bal">7,014,262,989</span></div><div class="pill">🏠 Lekki Phase 1</div><div class="pill" style="margin-left:auto;background:linear-gradient(135deg,#00c853,#009624);color:#fff">✨ Whole9ja RP FANCY</div></div><div id="game"><div class="window"><div class="city"><span></span><span></span><span style="height:35px"></span><span style="height:22px"></span><span style="height:28px"></span></div></div><div id="world"><div id="floor"></div><div class="wall" style="left:50%;top:45%;width:900px;height:18px;transform:translate(-50%,-260px) rotateX(60deg) rotateZ(-45deg) translateZ(80px)"></div><div class="wall" style="left:50%;top:45%;width:18px;height:700px;transform:translate(-260px,-50%) rotateX(60deg) rotateZ(-45deg) translateZ(80px)"></div><div class="furn" style="left:38%;top:32%">🛏️</div><div class="furn" style="left:32%;top:30%;font-size:28px">🗄️</div><div class="furn" style="left:52%;top:28%;font-size:32px">💻</div><div class="furn" style="left:55%;top:33%;font-size:26px">🪑</div><div class="furn" style="left:60%;top:58%;font-size:42px">🍲</div><div class="furn" style="left:62%;top:54%;font-size:22px">🥤🥤</div><div class="furn" style="left:68%;top:52%;font-size:28px">🛋️</div><div class="furn" style="left:40%;top:62%;font-size:30px">📺</div><div class="furn" style="left:36%;top:70%;font-size:24px">🌴</div><div id="player"><div class="shadow"></div><div class="body"><div class="head"></div></div></div><div id="other"><div class="body"><div class="head"></div></div></div></div><div class="alert" id="alertBox">🔔 <span id="alertText"></span><br><button class="b" style="padding:4px 10px;font-size:10px;margin-top:6px" onclick="accept()">Accept Enter</button></div><div id="jobs"><b style="font-size:12px;color:#fff">💼 Whole9ja Work</b><button class="job" onclick="work('yahoo',50000)"><span>💻 Yahoo</span><b>N50k</b></button><button class="job" onclick="work('danfo',5000)"><span>🚐 Danfo</span><b>N5k</b></button><button class="job" onclick="work('pos',8000)"><span>🏧 POS</span><b>N8k</b></button><button class="job" onclick="work('bet9ja',12000)"><span>🎰 Bet9ja</span><b>N12k</b></button><button class="job" onclick="work('ashawo',20000)"><span>💋 Ashawo</span><b>N20k</b></button><button class="job" style="background:linear-gradient(135deg,#8a2a2a,#5a1a1a)" onclick="work('lapo',-30000)"><span>👶 Lapo</span><b>-N30k</b></button><button class="job" style="background:linear-gradient(135deg,#00897b,#00695c)" onclick="airport()"><span>✈ Airport</span><b>Travel</b></button><button class="job" onclick="work('opay',15000)"><span>💳 OPay</span><b>N15k</b></button><button class="job" style="background:linear-gradient(135deg,#ff6f00,#e65100)" onclick="invite()"><span>👥 Invite</span><b>Link</b></button></div></div><div id="bottom"><div id="stats"><div class="av"></div><div class="meters"><div class="meter"><span>Energy</span><div style="width:78%;background:#4caf50"></div></div><div class="meter"><span>Hunger</span><div style="width:65%;background:#ff9800"></div></div><div class="meter"><span>Fun</span><div style="width:55%;background:#ffeb3b"></div></div><div class="meter"><span>Social</span><div style="width:82%;background:#e91e63"></div></div><div class="meter"><span>Hygiene</span><div style="width:70%;background:#00bcd4"></div></div><div class="meter"><span>Bladder</span><div style="width:45%;background:#9c27b0"></div></div></div><div class="pill" style="font-size:9px;line-height:1.1">Next shift<br><b>8:00 AM</b><br>₦2,500/hr</div></div><div id="nav"><button class="n active">🏠 Home</button><button class="n" onclick="shop()">🛒 Buy</button><button class="n" onclick="invite()">👥 Invite</button><button class="n" onclick="airport()">✈ Map</button><button class="n" onclick="phone()">📱 Phone</button></div></div><div id="modal"><div id="mbox"></div></div><script>let bal=7014262989;const bEl=document.getElementById('bal');function work(t,a){if(t==='lapo'){if(bal<30000){pop('You no get money for Lapo! Go work!');return}bal-=30000;pop('😭 Lapo Baby collect N30k! Omo you still owe!');}else{bal+=a;pop('✅ '+t.toUpperCase()+' done! +N'+a.toLocaleString());}bEl.innerText=bal.toLocaleString();localStorage.setItem('wrp_bal',bal)}function airport(){show('<h3>✈ Murtala Airport</h3><p style=font-size:12px;color:#666>Fly comot Lekki if Lapo dey pursue you!</p><br><button class=b onclick=fly("Abuja")>🛫 Abuja - N50k</button><br><button class=b onclick=fly("Port Harcourt")>🛫 Port Harcourt - N40k</button><br><button class=b onclick=fly("Lekki")>🛬 Back to Lekki</button><br><br><small style=color:red>⚠️ If you owe Lapo, he go block you for gate!</small><br><br><button class=b style=background:#555 onclick=hide()>Close</button>')}function fly(c){if(bal<40000){pop('No money for flight!');return}if(Math.random()<.2){pop('🚨 LAPO BABY BLOCK YOU FOR AIRPORT GATE! Pay N30k first!');return}bal-=40000;bEl.innerText=bal.toLocaleString();hide();pop('✈ Welcome to '+c+'! Lekki boy for abroad!')}function shop(){show('<h3>🛒 Fancy Shop - Whole9ja RP</h3><div style=display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px><div style=background:#f5f5f5;padding:10px;border-radius:12px;text-align:center>🛏️<br>King Bed<br><b>N25k</b></div><div style=background:#f5f5f5;padding:10px;border-radius:12px;text-align:center>🛋️<br>Velvet Sofa<br><b>N18k</b></div><div style=background:#f5f5f5;padding:10px;border-radius:12px;text-align:center>📺<br>Smart TV<br><b>N40k</b></div><div style=background:#f5f5f5;padding:10px;border-radius:12px;text-align:center>🍲<br>Jollof Table<br><b>N8k</b></div></div><br><button class=b style=background:#555 onclick=hide()>Close</button>')}function phone(){let a=prompt('OPay - Amount to send','5000');if(a){bal-=parseInt(a);bEl.innerText=bal.toLocaleString();pop('✅ N'+a+' sent via OPay!')}}function invite(){show('<h3>👥 Invite to Whole9ja RP FANCY</h3><p style=font-size:12px>Your Lekki apartment link:</p><input value="https://slimchisom1998-crypto.github.io/Whole9ja/?invite=BigT_house" style=width:100%;padding:10px;border-radius:10px;border:1px solid #ccc;margin:10px 0><br><button class=b onclick=navigator.clipboard.writeText(location.href);pop("Link copied! Send for WhatsApp!")>📋 Copy WhatsApp Link</button> <button class=b style=background:#ff6f00 onclick=simulate()>🎭 Simulate Visitor (Shade)</button><br><br><button class=b style=background:#555 onclick=hide()>Close</button>')}function simulate(){hide();document.getElementById('alertBox').style.display='block';document.getElementById('alertText').innerText='Shade wan enter your Lekki house!';document.getElementById('other').style.display='block';document.getElementById('other').style.left='58%';document.getElementById('other').style.top='48%';setTimeout(()=>{document.getElementById('alertBox').style.display='none'},6000);pop('Shade don enter! 2 people for house now!')}function accept(){document.getElementById('alertBox').style.display='none';pop('✅ Shade accepted! Una dey same dining table now!')}function show(h){document.getElementById('mbox').innerHTML=h;document.getElementById('modal').style.display='flex'}function hide(){document.getElementById('modal').style.display='none'}function pop(t){let d=document.createElement('div');d.style.cssText='position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:20px;font-size:12px;z-index:300;box-shadow:0 8px 20px rgba(0,0,0,.4)';d.innerText=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}document.getElementById('game').addEventListener('click',e=>{if(e.target.closest('#jobs')||e.target.closest('#modal'))return;let r=document.getElementById('game').getBoundingClientRect();let x=((e.clientX-r.left)/r.width)*100;let y=((e.clientY-r.top)/r.height)*100;document.getElementById('player').style.left=x+'%';document.getElementById('player').style.top=y+'%';});setInterval(()=>{document.getElementById('clock').innerText=new Date().toLocaleTimeString()},1000);</script></body></html>
