<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Whole9ja RP - Lagos Real Life</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#0d1a0f;color:#fff;overflow:hidden;touch-action:none}
#topbar{position:fixed;top:0;left:0;right:0;background:#1a2e1e;display:flex;gap:6px;padding:8px;z-index:100;font-size:11px;flex-wrap:wrap}
.pill{background:#2a4a2e;border-radius:20px;padding:6px 12px;display:flex;gap:6px;align-items:center}
.money{background:#fff;color:#000;font-weight:bold}
#stage{position:absolute;top:60px;bottom:85px;left:0;right:0;background:#1e3a28}
canvas{width:100%;height:100%;display:block}
#side{position:absolute;left:8px;top:8px;z-index:20;display:flex;flex-direction:column;gap:6px}
.card{background:#fff;color:#222;border-radius:12px;padding:8px 10px;font-size:11px;min-width:160px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#jobsPanel{position:absolute;right:8px;top:8px;z-index:20;background:rgba(0,0,0,.7);border-radius:12px;padding:10px;max-width:200px}
.jobBtn{display:block;width:100%;margin:4px 0;padding:6px;border:none;border-radius:8px;background:#2a5a3a;color:#fff;font-size:11px;text-align:left}
#bottom{position:fixed;bottom:0;left:0;right:0;background:#0f1e12;padding:8px;z-index:100}
#meters{display:flex;gap:4px;overflow-x:auto}
.meter{width:36px;height:6px;background:#333;border-radius:3px;overflow:hidden;flex-shrink:0}
.meter div{height:100%}
#nav{display:flex;gap:6px;justify-content:space-between;margin-top:6px;align-items:center}
.nBtn{border:none;padding:9px 14px;border-radius:20px;font-size:12px;background:#2a4a2e;color:#fff}
.nBtn.active{background:#fff;color:#000}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
#modalBox{background:#fff;color:#000;border-radius:16px;padding:20px;max-width:360px;width:100%}
.btn{padding:10px 16px;border:none;border-radius:10px;background:#00c853;color:#fff;margin:4px;font-weight:bold}
</style></head><body>
<div id="topbar">
 <div class="pill">🕒 <span id="clock">3:57 AM</span> 😊</div>
 <div class="pill money">₦<span id="bal">7,014,262,989</span></div>
 <div class="pill">👁 23.1m</div>
 <div class="pill" style="background:#00897b">✈ Whole9ja RP</div>
</div>
<div id="stage">
 <canvas id="c"></canvas>
 <div id="side">
  <div class="card">🏃 Walk Lekki Canopy<br><small style="color:orange">+3 ✨</small></div>
  <div class="card">💎 Gem hunt 10051 found<br>Next prize N3,000</div>
  <div class="card" id="inviteAlert" style="display:none;background:#ffeb3b;color:#000">🔔 <span id="invText"></span><br><button class="btn" style="padding:4px 8px;font-size:10px" onclick="acceptInvite()">Accept</button></div>
 </div>
 <div id="jobsPanel">
  <b style="font-size:12px">💼 WORK - Whole9ja RP</b>
  <button class="jobBtn" onclick="doJob('yahoo',50000)">💻 Yahoo - N50k</button>
  <button class="jobBtn" onclick="doJob('danfo',5000)">🚐 Danfo Driver - N5k</button>
  <button class="jobBtn" onclick="doJob('pos',8000)">🏧 POS - N8k</button>
  <button class="jobBtn" onclick="doJob('bet9ja',12000)">🎰 Bet9ja - N12k</button>
  <button class="jobBtn" onclick="doJob('ashawo',20000)">💋 Ashawo VIP - N20k</button>
  <button class="jobBtn" onclick="doJob('lapo',-30000)">👶 Lapo Baby - Pay N30k</button>
  <button class="jobBtn" onclick="openAirport()">✈ Airport - Travel</button>
  <button class="jobBtn" onclick="doJob('opay',15000)">💳 OPay Agent - N15k</button>
 </div>
</div>
<div id="bottom">
 <div style="display:flex;gap:8px;align-items:center">
  <img src="https://i.pravatar.cc/40?u=BigT" style="width:36px;height:36px;border-radius:50%;border:2px solid #fff">
  <div id="meters">
   <div class="meter"><div style="width:80%;background:#4caf50"></div></div>
   <div class="meter"><div style="width:70%;background:#ffeb3b"></div></div>
   <div class="meter"><div style="width:60%;background:#ff9800"></div></div>
   <div class="meter"><div style="width:90%;background:#e91e63"></div></div>
   <div class="meter"><div style="width:50%;background:#00bcd4"></div></div>
   <div class="meter"><div style="width:65%;background:#9c27b0"></div></div>
  </div>
  <div class="pill" style="margin-left:auto;font-size:10px">Next shift<br><b>8:00 AM</b></div>
 </div>
 <div id="nav">
  <button class="nBtn active">🏠 Home</button>
  <button class="nBtn" onclick="openShop()">🛒 Buy</button>
  <button class="nBtn" onclick="toggleInvite()">👥 Invite</button>
  <button class="nBtn" onclick="openAirport()">✈ Map</button>
  <button class="nBtn" onclick="openOPay()">📱 Phone</button>
 </div>
</div>
<div id="modal"><div id="modalBox"></div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,player={x:0,y:0,tx:0,ty:0,moving:false},cam={x:0,y:0},other=null;
function resize(){W=canvas.width=canvas.offsetWidth*2;H=canvas.height=canvas.offsetHeight*2}resize();addEventListener('resize',resize);
function iso(x,y){return{sx:W/2+(x-y)*60+cam.x,sy:H/3+(x+y)*30+cam.y}}
function tile(x,y,w,h,col){let a=iso(x,y),b=iso(x+w,y),c2=iso(x+w,y+h),d=iso(x,y+h);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(a.sx,a.sy);ctx.lineTo(b.sx,b.sy);ctx.lineTo(c2.sx,c2.sy);ctx.lineTo(d.sx,d.sy);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(0,0,0,.2)';ctx.stroke()}
function draw(){ctx.clearRect(0,0,W,H);for(let x=-6;x<8;x++)for(let y=-4;y<7;y++)tile(x,y,1,1,'#2d5a3a');tile(-3,-2,3,2,'#2a3a4a');tile(0,-2,3,2,'#3a3a3a');tile(-3,0,3,3,'#f5f0e0');tile(0,3,3,2,'#e8e8d0');let p=iso(player.x,player.y);ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(p.sx,p.sy+20,20,10,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1a3a5a';ctx.fillRect(p.sx-8,p.sy-30,16,30);ctx.fillStyle='#ffdbac';ctx.beginPath();ctx.arc(p.sx,p.sy-35,10,0,Math.PI*2);ctx.fill();if(other){let o=iso(other.x,other.y);ctx.fillStyle='#5a1a1a';ctx.fillRect(o.sx-8,o.sy-30,16,30);ctx.fillStyle='#ffdbac';ctx.beginPath();ctx.arc(o.sx,o.sy-35,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='20px sans-serif';ctx.fillText(other.name,o.sx-20,o.sy-50)}}
canvas.addEventListener('click',e=>{let r=canvas.getBoundingClientRect();let mx=(e.clientX-r.left)*2,my=(e.clientY-r.top)*2;let gx=((mx-W/2-cam.x)/60+(my-H/3-cam.y)/30)/2,gy=((my-H/3-cam.y)/30-(mx-W/2-cam.x)/60)/2;player.tx=gx;player.ty=gy;player.moving=true;});
function anim(){if(player.moving){player.x+=(player.tx-player.x)*0.08;player.y+=(player.ty-player.y)*0.08;if(Math.hypot(player.x-player.tx,player.y-player.ty)<0.05)player.moving=false}draw();requestAnimationFrame(anim)}anim();
let balance=7014262989;
function doJob(t,a){if(t==='lapo'){if(balance<30000){alert('You no get money pay Lapo o! Go work!');return}balance-=30000;alert('😭 Lapo Baby don collect N30k! You still owe N100k');}else{balance+=a;alert('✅ Work done: '+t+' You earn N'+a.toLocaleString())}document.getElementById('bal').innerText=balance.toLocaleString();localStorage.setItem('whole9ja_bal',balance);}
function openAirport(){showModal('<h3>✈ Murtala Airport - Whole9ja RP</h3><br><button class=btn onclick=travel(\'Abuja\')>🛫 Abuja - N50k</button><br><button class=btn onclick=travel(\'PH\')>🛫 Port Harcourt - N40k</button><br><button class=btn onclick=travel(\'Lekki\')>🛬 Back to Lekki</button><br><br><small>Lapo baby dey wait for you for Mushin if you no pay</small><br><br><button class=btn style=background:#555 onclick=hideModal()>Close</button>');}
function travel(city){if(balance<40000){alert('No money for flight!');return}balance-=40000;document.getElementById('bal').innerText=balance.toLocaleString();hideModal();alert('✈ Welcome to '+city+'!');}
function openShop(){showModal('<h3>🛒 Whole9ja RP Shop</h3><p>Redesign your house:</p><button class=btn>🛏 Bed - N20k</button> <button class=btn>🛋 Sofa - N15k</button> <button class=btn>📺 TV - N30k</button> <button class=btn>🌴 Plant - N5k</button><br><br><button class=btn style=background:#555 onclick=hideModal()>Close</button>')}
function openOPay(){let a=prompt('OPay: Amount to transfer','5000');if(a){balance-=parseInt(a);document.getElementById('bal').innerText=balance.toLocaleString();alert('✅ N'+a+' sent via OPay!')}}
let inviteLink='https://slimchisom1998-crypto.github.io/Whole9ja/?invite=BigT_house';
function toggleInvite(){showModal('<h3>👥 Invite to Whole9ja RP</h3><p>Send link to guy/babe:</p><input value=\''+inviteLink+'\' style=width:100%;padding:8px;border-radius:8px;border:1px solid #ccc><br><br><button class=btn onclick=navigator.clipboard.writeText(\''+inviteLink+'\');alert(\'Link copied!\')>📋 Copy Link</button> <button class=btn onclick=simulateVisit()>🎭 Simulate Visitor</button><br><br><button class=btn style=background:#555 onclick=hideModal()>Close</button>')}
function simulateVisit(){hideModal();document.getElementById('inviteAlert').style.display='block';document.getElementById('invText').innerText='Shade wan enter your house!';other={x:1,y:1,name:'Shade'};setTimeout(()=>{document.getElementById('inviteAlert').style.display='none'},5000)}
function acceptInvite(){document.getElementById('inviteAlert').style.display='none';other={x:1,y:1,name:'Shade'};alert('Shade don enter! Una two dey house now!')}
function showModal(h){document.getElementById('modalBox').innerHTML=h;document.getElementById('modal').style.display='flex'}
function hideModal(){document.getElementById('modal').style.display='none'}
setInterval(()=>{document.getElementById('clock').innerText=new Date().toLocaleTimeString()},1000);
</script></body></html>
